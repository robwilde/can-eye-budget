# Opcode Configuration Template
# Copy this file to 'op.conf' and customize for your environment
# Opcode lets you define shortcuts to commands for your project
# https://github.com/DannyBen/opcode
# Install: curl -Ls get.dannyb.co/opcode/setup | bash

art: php artisan "$@"

comp: composer "$@"

pint: vendor/bin/pint "$@"
pest: vendor/bin/pest "$@"
pest-v: vendor/bin/pest "$@" -v
pest-debug: op pest "$@" --debug
pest-headed: PEST_BROWSER_HEADLESS=false vendor/bin/pest "$@" --headed

#| Watch a specific test | PEST_BROWSER_HEADLESS=false php artisan test --filter="your test name"
#| Debug failing test slowly | PEST_BROWSER_HEADLESS=false PEST_BROWSER_SLOWMO=1000 php artisan test --filter="failing test" |
#| Watch all auth tests | PEST_BROWSER_HEADLESS=false php artisan test tests/Browser/AuthenticationTest.php |
#| Mobile viewport tests | PEST_BROWSER_HEADLESS=false php artisan test --filter="mobile" |

test: op art test "$@"

reseed: php artisan migrate:fresh --seed

clear:
    op art cache:clear
    op art config:clear
    op art route:clear
    op art view:clear

clean:
    truncate -s 0 storage/logs/*.log
